name: CI

on:
  push:
    branches: [main, master, 3.2.7]
    tags: ['v*']
  pull_request:
    branches: [main, master, 3.2.7]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: temurin
          cache: maven

      - name: Run tests
        run: ./mvnw test -pl sm-core -am -q

      - name: Build artifact
        run: ./mvnw package -pl sm-shop -am -DskipTests -q

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shopizer-backend
          path: sm-shop/target/*.jar
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sm-shop/target/*.jar

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: sm-shop
          push: true
          tags: |
            smriti70/shopizer-backend:latest
            smriti70/shopizer-backend:${{ github.sha }}
