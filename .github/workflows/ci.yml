name: CI

on:
  push:
    branches: [main, master, 3.2.7]
  pull_request:
    branches: [main, master, 3.2.7]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: temurin
          cache: maven

      - name: Run tests
        run: ./mvnw test -pl sm-core -am -q

      - name: Build artifact
        run: ./mvnw package -pl sm-shop -am -DskipTests -q

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shopizer-backend
          path: sm-shop/target/*.jar
          retention-days: 7
